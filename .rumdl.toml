#:schema https://raw.githubusercontent.com/rvben/rumdl/refs/heads/main/rumdl.schema.json
# 完整配置：rumdl 0.3.2 的 90 条规则，按 MD 编号升序排列。
# 官方文档与对应版本源码：https://github.com/rvben/rumdl/tree/v0.3.2/docs
# 全局设置：https://rumdl.dev/global-settings/
# 每条规则显式设置 enabled；有确定默认值的参数全部填写，并保留原有风格值。
# 标为“自动 / 不设限制”的可选参数按约定不写赋值，以保留其特殊语义；TOML 不支持 null。
# extends：不继承其他配置文件。通用 severity：不覆盖，保留各规则原生的诊断级别。

[global]
# 全部规则的启用与禁用均由下面的 [MDxxx].enabled 控制。
# enabled=true：执行该规则；enabled=false：完全跳过该规则。
# 规则内 fix=true 仅允许在 fmt / check --fix 时修复；fix=false 仍检查，只禁止该项可选修复。
# 自动修复还受 global.unfixable 限制，单纯 check 不会写回文件。
enable = []
disable = []
extend-enable = []
extend-disable = []
include = []  # 不额外限制文件扫描范围
# 排除仓库/编辑器元数据、第三方依赖、构建产物、工具缓存和临时文件。
# 不含 / 的目录名匹配任意层级；build/** 等含 / 的模式相对于项目根目录。
exclude = [
  # 版本控制与编辑器目录
  ".git",
  ".hg",
  ".svn",
  ".github",
  ".idea",
  ".vscode",

  # 第三方依赖与虚拟环境
  "node_modules",
  "vendor",
  ".venv",
  "venv",
  ".tox",
  "themes",

  # Hugo 及常见工具的构建输出；不排除 content、static 等源目录
  "public/**",
  "resources/_gen/**",
  "dist/**",
  "build/**",
  "out/**",
  "target/**",
  "coverage/**",

  # 检查器、包管理器和解释器缓存
  ".cache",
  ".rumdl_cache",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  ".pnpm-store",
  ".yarn/cache/**",
  "__pycache__",

  # 临时目录、编辑器交换文件与备份（含仍以 .md 结尾的副本）
  "tmp",
  "temp",
  "*.tmp",
  "*.tmp.md",
  "*.bak",
  "*.bak.md",
  "*.orig",
  "*.orig.md",
  "*.swp",
  "*.swo",
  "*~",

  # 沿用原有的非正文文件排除项
  "CHANGELOG.md",
  "LICENSE.md",
  ".rumdl.toml",
]
respect-gitignore = true  # true：扫描目录时遵循 Git/.ignore 排除；false：扫描时不采用这些排除（显式 exclude 仍生效）
line-length = 80  # 全局行长基准；MD013 已在自己的规则段中关闭
output-format = "text"  # 默认诊断输出格式
flavor = "standard"  # 保留现有 Markdown 方言
fixable = []  # 不额外限制允许自动修复的规则
# MD040 继续诊断缺失语言和标签不一致，但不自动补 text 或改写语言标签。
unfixable = ["MD040"]
cache = true  # true：复用检查结果缓存；false：每次重新检查
cache-dir = ".rumdl_cache"  # 缓存目录，相对于项目根目录
editorconfig = false  # true：从 .editorconfig 补充未配置的设置；false：不读取 .editorconfig

[per-file-ignores]
# 空表：不额外按文件禁用规则。

[per-file-flavor]
# 空表：不额外按文件覆盖 Markdown 方言。

[code-block-tools]
enabled = true  # true：按语言配置运行外部检查/格式化工具；false：跳过外部工具
normalize-language = "linguist"  # 使用 Linguist 归一化语言标签
on-error = "fail"  # 外部工具执行出错时失败
on-missing-language-definition = "ignore"  # 忽略没有定义外部工具的语言
on-missing-tool-binary = "warn"  # 缺少外部工具可执行文件时警告
binary-preferences = {}  # 不覆盖外部工具可执行文件路径
on-tool-version-mismatch = "warn"  # 工具版本不匹配时警告
on-missing-language-tag = "ignore"  # 忽略缺少语言标签的代码块
on-missing-mode-definition = "ignore"  # 忽略没有定义的执行模式
on-no-tools-run = "ignore"  # 没有运行任何工具时忽略
timeout = 30000  # 外部工具执行超时，单位为毫秒
languages = {}  # 不配置逐语言的外部工具链
language-aliases = {}  # 不配置额外的语言别名映射
tools = {}  # 不注册额外的外部工具

[MD001]
# 标题级别每次最多增加一级：https://rumdl.dev/md001/
# enabled=true 时检查标题级别跳跃；false 时允许原文保留跳级。
enabled = true
front-matter-title = true  # true：Frontmatter 标题计为隐含 H1；false：判断标题层级时只看正文标题
# 自动 / 不设限制 — front-matter-title-pattern：不覆盖标题匹配模式，继续识别 title 字段。

[MD003]
# 标题标记风格：https://rumdl.dev/md003/
# 统一使用 # 形式，不使用 Setext 或闭合式标题。
enabled = true
style = "atx"  # 此规则使用的风格

[MD004]
# 无序列表标记风格：https://rumdl.dev/md004/
# 统一用 - 作为无序列表标记。
enabled = true
style = "dash"  # 此规则使用的风格

[MD005]
# 同级列表项缩进一致：https://rumdl.dev/md005/
enabled = true

[MD007]
# 无序列表缩进：https://rumdl.dev/md007/
# 无序列表每级 2 个空格；混合有序列表时保留按父项正文列对齐的自动兼容行为。
enabled = true
indent = 2  # 每级缩进的空格数量
start-indent = 2  # 首层列表选择缩进开头时使用的空格数
start-indented = false  # true：首层无序列表可按 start-indent 缩进；false：首层列表从第 0 列开始
# 自动 / 不设限制 — style：不固定为 fixed 或 text-aligned，保留混合列表的自动对齐与固定缩进兼容行为。

[MD009]
# 行尾多余空格：https://rumdl.dev/md009/
enabled = true
br-spaces = 2  # Markdown 硬换行允许的尾随空格数量
list-item-empty-lines = false  # true：允许列表项空行保留缩进空格；false：这些空格也按 strict/br-spaces 检查
# strict=false：恰好 br-spaces 个行尾空格按有意硬换行保留，并跳过代码块内部。
# strict=true：仅在同一段落还有后续正文、确实会渲染为硬换行时保留这些空格；
# 标题末尾、段落/列表项末尾等不产生换行的位置会报告，代码块内部也会检查。
# 例如 br-spaces=2 时，标题末尾两个空格在 false 模式保留，在 true 模式报告。
# 两种模式都保留跨行行内代码里的字面空白；其他例外仍由 list-item-empty-lines 等参数控制。
strict = false

[MD010]
# 使用空格而非 Tab 缩进：https://rumdl.dev/md010/
enabled = true
code-blocks = false  # true：代码块和行内代码中的 Tab 也检查；false：跳过它们（行内代码的 Tab 始终不自动改写）
ignore-code-languages = []  # 跳过这些语言的代码块
spaces-per-tab = 4  # 修复时每个 Tab 替换的空格数

[MD011]
# 链接文字与目标的括号顺序：https://rumdl.dev/md011/
enabled = true

[MD012]
# 连续空行数量：https://rumdl.dev/md012/
enabled = true
maximum = 1  # 允许的连续空行上限

[MD013]
# 行长与段落重排：https://rumdl.dev/md013/
# 不限制行长，保留中文段落、长链接和代码的原始换行。
enabled = false
abbreviations = []  # 额外识别的缩写词，供重排时判断句子边界
atomic-spans = true  # true：重排时优先整体保留代码/强调片段；false：允许按词拆分，仍遵守代码保护条件
blockquotes = true  # true：检查引用块行长；false：跳过引用块行长检查（strict=true 时仍检查）
bracket-display-math = false  # true：将独立的 \[ ... \] 视为展示公式；false：按普通 Markdown 解析转义方括号
break-words = []  # 用于辅助段落重排的断行词
cjk-soft-break = "space"  # 中日韩文本软换行的连接方式
code-blocks = true  # true：检查代码块行长；false：跳过代码块行长检查（strict=true 时仍检查）
code-spans = true  # true：行内代码导致的超长也报告；false：去掉行内代码后不超限的行可豁免（strict=true 时仍有效）
headings = true  # true：检查标题行长；false：跳过标题行长检查（strict=true 时仍检查）
ignore-link-urls = true  # true：仅因行内链接/图片 URL 超长的行可豁免；false：URL 也计入行长（strict=true 时此项无效）
length-mode = "visual"  # 按显示宽度计算行长
line-length = 80  # 最大行长
link-text-punctuation = "ignore"  # 重排时如何处理链接文字中的标点
math-blocks = true  # true：检查展示公式行长；false：跳过纯展示公式行（strict=true 时仍检查）
paragraphs = true  # true：检查普通段落和引用正文行长；false：跳过这些正文行（strict=true 时仍检查）
reflow = false  # true：修复时重排长段落；false：只报告行长问题，不重排正文
reflow-break-code-spans = true  # true：atomic-spans=false 时允许按词拆分行内代码；false：行内代码始终保持整体
reflow-break-link-text = false  # true：重排时允许在链接/图片文字内部换行；false：整个链接/图片保持整体
reflow-length-exemptions = false  # true：重排测量也采用 URL/代码豁免；false：重排按原始文本宽度测量，即使检查本身可豁免
reflow-mode = "default"  # 段落重排模式
require-sentence-capital = true  # true：句子边界后的新句需以大写开头；false：允许小写开头，其他句子边界条件仍生效
# stern=true：只因最后一个词越界也报告，但整行只有一个不可拆分词元时仍豁免。
# stern=false：保留默认的“仅最后一个词越界”豁免；strict=true 时两种取值都不起作用。
stern = false
# strict=false：保留 URL、不可换行内容等行长豁免，并按其他参数决定哪些内容跳过检查。
# strict=true：取消这些行长豁免；单独的长 URL、代码块、表格等超长也会报告。
# true 优先于 stern、ignore-link-urls 和代码块/表格等类别的跳过设置；仍使用对应行长上限。
# code-spans=false 是独立例外：即使 strict=true，只有行内代码导致超长的行仍可豁免。
# 例如一整行只有超过 line-length 的 URL：false 可以放过，true 会报告。
strict = false
tables = false  # true：检查表格行长；false：跳过表格行长检查（strict=true 时仍检查）
# 自动 / 不设限制 — heading-line-length：不另设标题行长，自动继承 line-length。
# 自动 / 不设限制 — code-block-line-length：不另设代码块行长，自动继承 line-length。

[MD014]
# 带 $ 提示符的命令是否展示输出：https://rumdl.dev/md014/
# 示例命令供读者直接复制，不要求同时提供输出。
enabled = false
show-output = true  # true：检查本应有输出的 Shell 命令是否展示输出；false：不做这项缺少输出的检查

[MD018]
# ATX 标题的 # 后需要空格：https://rumdl.dev/md018/
enabled = true
magiclink = false  # true：把 #数字 识别为 MagicLink 特例；false：仍按缺少空格的标题检查
# 自动 / 不设限制 — tags：不覆盖方言决定的标签识别行为；当前 standard 方言不启用标签特例。

[MD019]
# ATX 标题的 # 后不应有多余空格：https://rumdl.dev/md019/
enabled = true

[MD020]
# 闭合式 ATX 标题的井号内侧需要空格：https://rumdl.dev/md020/
enabled = true

[MD021]
# 闭合式 ATX 标题的井号内侧不应有多余空格：https://rumdl.dev/md021/
enabled = true

[MD022]
# 标题前后的空行：https://rumdl.dev/md022/
enabled = true
allowed-at-start = true  # true：文档开头的标题可省略前置空行；false：开头也要求 lines-above 指定的空行
lines-above = 1  # 标题前的空行数量
lines-above-mode = "minimum"  # 标题前至少保留指定数量的空行
lines-below = 1  # 标题后的空行数量

[MD023]
# 标题从行首开始：https://rumdl.dev/md023/
# 允许缩进标题，保留原文用于嵌套表达的写法。
enabled = false

[MD024]
# 重复标题文字：https://rumdl.dev/md024/
# 不同章节可以使用相同的小节名称。
enabled = false
allow-different-link-anchors = true  # true：同名但 {#id} 不同的标题不算重复；false：忽略 {#id} 差异后比较标题文字
allow-different-nesting = false  # true：不同标题级别可重名；false：不按级别豁免，仍受 siblings-only 的比较范围限制
siblings-only = true  # true：只比较同一父标题下的同级标题；false：在整篇文档范围内检查重名

[MD025]
# 文档只保留一个主标题：https://rumdl.dev/md025/
# 允许 Frontmatter 的 title 与正文 H1 并存，也保留多个一级标题。
enabled = false
allow-document-sections = false  # true：允许用水平线分隔独立文档章节及其主标题；false：不采用此多主标题例外
allow-with-separators = false  # true：允许分隔章节使用多个主标题；false：不采用此多主标题例外
front-matter-title = "title"  # 用于识别 Frontmatter 标题的设置
level = 1  # 所检查的标题级别

[MD026]
# 标题末尾标点：https://rumdl.dev/md026/
enabled = true
punctuation = ".,;:!"  # 用于此规则判定的标点字符

[MD027]
# 引用标记 > 后的多余空格：https://rumdl.dev/md027/
enabled = true
list-items = false  # true：也检查引用块内列表及续行的额外空格；false：将这些空格按列表缩进保留

[MD028]
# 引用块之间的空行：https://rumdl.dev/md028/
enabled = true
fix = false  # true：修复时在间隔空行补 >，合并连续引用块；false：只报告，不合并引用块

[MD029]
# 有序列表编号风格：https://rumdl.dev/md029/
# 有序列表使用 1.、2.、3. 递增编号。
enabled = true
style = "ordered"  # 此规则使用的风格

[MD030]
# 列表标记后的空格：https://rumdl.dev/md030/
enabled = true
ol-align-column = 0  # 有序列表正文固定对齐列；0 表示不指定
ol-multi = 1  # 多行有序列表项标记后的空格
ol-single = 1  # 单行有序列表项标记后的空格
ul-multi = 1  # 多行无序列表项标记后的空格
ul-single = 1  # 单行无序列表项标记后的空格

[MD031]
# 围栏代码块前后的空行：https://rumdl.dev/md031/
enabled = true
list-items = true  # true：列表项内的围栏代码也要求前后空行；false：只对列表外的围栏代码提出此要求

[MD032]
# 列表前后的空行：https://rumdl.dev/md032/
enabled = true
allow-lazy-continuation = true  # true：保留列表项普通文本的懒续行；false：列表边界需要的空行不因懒续行而豁免

[MD033]
# 正文中的 HTML 标签：https://rumdl.dev/md033/
# 允许正文保留内联或块级 HTML，兼容文章中的自定义排版。
enabled = false
allowed-elements = []  # 允许出现的 HTML 标签
allowed-inside = []  # 允许在指定 HTML 容器内使用标签
br-style = "trailing-spaces"  # 转换 br 标签时使用的硬换行形式
disallowed-elements = []  # 禁止出现的 HTML 标签
drop-attributes = ["target", "rel", "width", "height", "align", "class", "id", "style"]  # 转换 HTML 时可以丢弃的属性
fix = false  # true：修复时将可转换的 HTML 改为 Markdown；false：只报告，不转换 HTML
fix-mode = "conservative"  # HTML 转换使用保守策略
strip-wrapper-elements = ["p"]  # 转换 HTML 时可移除的包裹标签
# 自动 / 不设限制 — table-allowed-elements：不另设表格内 HTML 白名单，继承 allowed-elements。

[MD034]
# 裸 URL 应使用链接或尖括号：https://rumdl.dev/md034/
enabled = true

[MD035]
# 水平线标记风格：https://rumdl.dev/md035/
enabled = true
style = "consistent"  # 此规则使用的风格

[MD036]
# 将独立强调段落识别为标题：https://rumdl.dev/md036/
# 保留中文文章用独立加粗段落强调内容的写法，不强制改为标题。
enabled = false
fix = false  # true：修复时把独立强调段落改为 heading-level 级标题；false：只报告，不把强调改成标题
heading-level = 2  # 将独立强调段落转换为标题时使用的级别
heading-style = "atx"  # 转换得到的标题使用的标记风格
punctuation = ".,;:!?"  # 用于此规则判定的标点字符

[MD037]
# 强调标记内侧的多余空格：https://rumdl.dev/md037/
enabled = true

[MD038]
# 行内代码标记内侧的多余空格：https://rumdl.dev/md038/
enabled = true

[MD039]
# 链接文字内侧的多余空格：https://rumdl.dev/md039/
enabled = true

[MD040]
# 围栏代码块的语言标签：https://rumdl.dev/md040/
# 同一文档内统一语言标签；global.unfixable 禁止此规则的全部自动修复。
enabled = true
allowed-languages = []  # 允许的语言白名单；空列表不限制
custom-languages = []  # 额外认可的自定义语言标签
disallowed-languages = []  # 语言黑名单；白名单非空时忽略此项
preferred-aliases = {}  # 指定语言的首选标签别名
style = "consistent"  # 此规则使用的风格
unknown-language-action = "ignore"  # 如何处理不认识的语言标签

[MD041]
# 文档开头的主标题：https://rumdl.dev/md041/
# 规则支持 Frontmatter 标题；这里额外允许正文直接从章节或段落开始。
enabled = false
allow-preamble = false  # true：允许正文前言，检查随后首个顶层标题的级别；false：要求正文开头就是指定级别的标题
fix = false  # true：修复时尝试调整或补充开头标题；false：只报告，不改写标题
front-matter-title = "title"  # 用于识别 Frontmatter 标题的设置
level = 1  # 所检查的标题级别
# 自动 / 不设限制 — front-matter-title-pattern：不覆盖匹配模式，使用 front-matter-title 指定的字段。

[MD042]
# 空链接：https://rumdl.dev/md042/
enabled = true

[MD043]
# 必需标题及其顺序：https://rumdl.dev/md043/
enabled = true
headings = []  # 要求存在的标题列表；空列表不增加结构要求
match-case = false  # true：必需标题匹配时区分大小写；false：大小写不同仍可匹配

[MD044]
# 专有名词大小写：https://rumdl.dev/md044/
# 保留原文专有名词大小写，不强制套用项目级名称列表。
enabled = false
code-blocks = false  # true：也检查代码块中的专有名词；false：跳过代码块中的名称检查
html-comments = true  # true：检查 HTML 注释中的名称；false：跳过注释中的名称
