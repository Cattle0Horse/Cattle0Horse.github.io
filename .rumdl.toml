# 规则详细含义见 https://rumdl.dev/<mdxxx>/（全小写）

[global]
disable = [
    "MD001", # 标题级别跳跃——原文用 ### 作为首个标题级别，是作者的结构选择
    "MD013", # 禁用行长度限制
    "MD014", # $ 命令须展示输出——KB 中命令示例给读者复制用，不需要输出
    "MD023", # 标题必须在行首——允许缩进标题用于嵌套语义
    "MD024", # 不允许重复标题——同名章节在不同上下文中常见
    "MD025", # 只允许一个 H1——rumdl 把 frontmatter 的 `title` 也当作 H1，会把正文 H1 降级
    "MD033", # 不允许内联 HTML——raw 内容中需要保留原始 HTML
    "MD036", # 加粗短语应升级为标题——基于英文写作习惯，中文 **加粗** 常作段内强调，误判率极高
    "MD041", # 首行必须是 H1——raw/* 文件首行是 YAML frontmatter，与此规则冲突
    "MD044", # 专有名词大小写——基于英文专有名词，中文 KB 不适用
    "MD059", # 链接文本须有描述性——KB 中常用 [1]、[2] 等短引用
]

respect_gitignore = true

# MD040 需要大模型按代码内容语义判断语言；rumdl 只负责检测缺失，不自动补 text
unfixable = ["MD040"]

exclude = [
    ".git",
    ".github",
    "node_modules",
    "CHANGELOG.md",
    "LICENSE.md",
    ".rumdl.toml",
    "*.tmp",
]

# ── 标题 ──

[MD003]
style = "atx" # 统一用 #，不用 setext 或闭合式

# ── 列表 ──

[MD004]
style = "dash" # 统一用 - 做无序列表标记

[MD005]
# 同级列表项缩进量须一致（自动检测模式，无参数）

[MD007]
indent = 2 # 无序列表嵌套每级缩进 2 空格

[MD029]
style = "ordered" # 有序列表用 1. 2. 3. 递增

[MD030]
ul_single = 1 # 无序列表单行项，标记后 1 个空格
ol_single = 1 # 有序列表单行项，标记后 1 个空格
ul_multi = 1  # 无序列表多行项，标记后 1 个空格
ol_multi = 1  # 有序列表多行项，标记后 1 个空格

[MD032]
allow_lazy_continuation = true # 允许列表续行懒缩进

[MD069]
# 不允许连续重复的列表标记（无参数）

[MD076]
style = "tight"                 # 列表项之间不留空行；项内部允许多段之间的空行
allow_loose_continuation = true

[MD077]
# 列表续行缩进须一致（无参数，由全局 flavor 控制）

# ── 代码块 ──

[MD031]
# 围栏代码块前后须有空行

[MD040]
style = "consistent" # 统一语言标签；缺失语言只检测，不自动修复

[MD046]
style = "fenced" # 统一用围栏代码块，不用缩进式

[MD048]
style = "backtick" # 统一用 ``` 做围栏，不用 ~~~

[MD070]
enabled = true # 嵌套代码块须用更长围栏——默认关闭，需显式启用

# ── 强调 ──

[MD037]
# 强调标记内侧不应有多余空格

[MD049]
style = "asterisk" # 统一用 * 做斜体

[MD050]
style = "asterisk" # 统一用 ** 做粗体

# ── 链接 ──

[MD011]
# 检测反向链接语法 ](url)[text

[MD034]
# 裸 URL 须包裹在尖括号中

[MD039]
# 链接文本内不应有多余空格

[MD042]
# 不允许空链接

[MD051]
# 文档内锚点链接应指向实际存在的标题

[MD052]
# 引用式链接应使用已定义的引用标识符

[MD053]
# 不应有未使用的引用链接定义

[MD057]
# 相对链接应指向实际存在的文件
# 把 `/` 开头视为相对项目根的文件路径（KB 不是发布站点，没有 URL 路由概念）
absolute-links = "relative_to_roots"
roots = [""]

[MD062]
# 链接目标不应有多余的前导/尾随空格

# ── 表格 ──

[MD055]
# 表格管道符风格须一致

[MD056]
# 表格每行列数须一致

[MD058]
# 表格前后须有空行

[MD060]
# 表格列对齐风格须一致

[MD075]
# 检测孤立的表格行

# ── 脚注 ──

[MD066]
# 脚注引用应指向已定义的脚注
enabled = false

[MD067]
# 脚注定义应按首次引用顺序排列
enabled = false

[MD068]
# 脚注定义不应为空

# ── Frontmatter ──

[MD071]
# frontmatter 之后须有空行

[MD072]
enabled = false # frontmatter key 不按字母顺序排列
# ── 空白 ──

[MD009]
# 行尾不应有尾随空格

[MD010]
# 不应用 tab 缩进

[MD012]
# 不应有连续多个空行

[MD035]
# 水平线风格须一致

[MD047]
# 文件末尾应恰好有一个换行符

[MD064]
# 行内不应有多个连续空格

[MD065]
# 水平线前后须有空行

# ── 图片 ──

[MD045]
enabled = false # 图片不一定需要 alt 文本（目前很多文章没有，以后多模态识别可能可以自动生成）

# ── 其他 ──

[MD038]
# 代码 span 内不应有多余空格

[MD063]
# 标题首字母大写风格须一致

[MD073]
# 目录应与文档实际标题匹配
