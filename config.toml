baseURL = "https://cattle0horse.github.io"
locale = "zh-cn"
title = "CattleHorse's Blog" # for rss
theme = "yinyang"

#[permalinks]
#posts = "/blog/:slug/"

# Blog RSS 开关：从 home 中移除 "RSS" 即禁用 /index.xml。
[outputs]
home = ["HTML", "RSS"]
section = ["HTML"]
taxonomy = ["HTML"]
term = ["HTML"]

# Notes RSS 开关：删除此 cascade，或将 outputs 改为 ["HTML"] 即禁用 /notes/index.xml。
[[cascade]]
outputs = ["HTML", "RSS"]

[cascade.target]
kind = "section"
path = "/notes"

# 代码高亮
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["$$", "$$"]]
          inline = [["$", "$"]]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    guessSyntax = true
    noClasses = false
    style = "tango"
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[params]
headTitle = "CattleHorse's Blog"
description = "By accumulating small steps, one can reach a thousand miles."
mainSections = ["posts"]
favicon = "/logo.png"
extraCSSFiles = ["css/background.css"]
extraHead = '''
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@callmebill/lxgw-wenkai-web@latest/lxgwwenkai-regular/result.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/firacode@6.2.0/distr/fira_code.min.css" />
  <style>
    body { font-family: "LXGW WenKai", sans-serif; }
    pre, code { font-family: "Fira Code", "SF Mono", Menlo, monospace; }
  </style>
'''
tableOfContents = true
codeMaxLines = 15

[params.colorScheme]
default = "yinyang"
available = ["yinyang", "solarized"]
allowUserChoice = true

[params.image]
enabled = true
lazy = true
loading = true

[params.postContent]
enabled = true
header = ""
footer = ""

[params.actions]
enabled = true
copyMarkdown = true

[params.actions.editPage]
enabled = true
repo = "https://github.com/Cattle0Horse/Cattle0Horse.github.io"
branch = "main"
text = "有错误？欢迎提交 Pull Request"

[params.author]
homepage = "https://github.com/cattle0horse"
name = "CattleHorse"

[[params.socials]]
name = "Theme"
link = "https://github.com/Cattle0Horse/hugo-theme-yinyang"
[[params.socials]]
name = "Notes"
link = "/notes/"
[[params.socials]]
name = "Tags"
link = "/tags/"
[[params.socials]]
name = "Categories"
link = "/categories/"
[[params.socials]]
name = "RSS"
link = "/index.xml"
[[params.socials]]
name = "Github"
link = "https://github.com/cattle0horse"
