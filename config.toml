baseURL = "https://cattle0horse.github.io"
locale = "zh-cn"
title = "CattleHorse's Blog" # for rss
theme = "yinyang"

#[permalinks]
#posts = "/blog/:slug/"

[permalinks.taxonomy]
note_tags = "/notes/tags/"

[permalinks.term]
note_tags = "/notes/tags/:slug/"

[taxonomies]
tag = "tags"
note_tag = "note_tags"

# Blog RSS 开关：从 home 中移除 "RSS" 即禁用 /index.xml。
[outputs]
home = ["HTML", "RSS"]
section = ["HTML"]
taxonomy = ["HTML"]
term = ["HTML"]

# Notes RSS 开关：删除此 cascade，或将 outputs 改为 ["HTML"] 即禁用 /notes/index.xml。
[[cascade]]
outputs = ["HTML", "RSS"]

[cascade.target]
kind = "section"
path = "/notes"

# 代码高亮
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["$$", "$$"]]
          inline = [["$", "$"]]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    guessSyntax = true
    noClasses = false
    style = "tango"
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[params]
headTitle = "CattleHorse's Blog"
description = "By accumulating small steps, one can reach a thousand miles."
mainSections = ["posts"]
favicon = "/logo.png"
extraCSSFiles = ["css/background.css"]
tableOfContents = true
codeMaxLines = 15

[params.busuanzi]
enabled = true

[params.notFound]
# 按当前设备筛选后随机显示；未配置或没有有效项时启用全部，再按设备筛选。
available = ["sleep", "black-hole", "flashlight", "receipt", "constellation", "puzzle", "terminal", "channel", "cat", "draw-home"]

[params.colorScheme]
default = "indigo"
available = ["indigo", "violet", "teal", "amber", "rose", "graphite"]
allowUserChoice = true

[params.image]
enabled = true
lazy = true
loading = true
border = true
galleryBorder = false

[params.postContent]
enabled = true
header = ""
footer = ""

[params.actions]
enabled = true
copyMarkdown = true

[params.actions.editPage]
enabled = true
repo = "https://github.com/Cattle0Horse/Cattle0Horse.github.io"
branch = "main"
text = "有错误？欢迎提交 Pull Request"

[params.aiLabel]
enabled = true
assisted = "AI 辅助创作"
generated = "AI 生成 · 经人工编辑"

[params.author]
homepage = "https://github.com/cattle0horse"
name = "CattleHorse"

[[params.socials]]
name = "Tags"
link = "/tags/"
icon = "tag"

[[params.socials]]
name = "Notes"
link = "/notes/"
icon = "file"

[[params.socials]]
name = "RSS"
link = "/index.xml"
icon = "rss"

[[params.socials]]
name = "Github"
link = "https://github.com/cattle0horse"
icon = "github"
