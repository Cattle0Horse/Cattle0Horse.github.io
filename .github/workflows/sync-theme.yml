name: sync-theme

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-theme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # submodule 的 url 是 SSH 形式，CI 里没有 SSH key，改写为 HTTPS
      - name: Rewrite submodule URL for CI
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Update theme submodule to latest
        run: git submodule update --init --remote themes/yinyang

      - name: Commit and push
        id: update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/yinyang
          if git diff --cached --quiet; then
            echo "Theme already up to date, nothing to commit"
          else
            short_hash=$(git -C themes/yinyang rev-parse --short HEAD)
            git commit -m "chore: sync theme to ${short_hash}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN 推送不会触发 push 工作流，需要显式触发站点部署
      - name: Deploy updated site
        if: steps.update.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hugo.yml --ref "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
